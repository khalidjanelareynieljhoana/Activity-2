<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Team Web Portfolio</title>
    <meta name="description" content="Contact form and feedback submission page for our team.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Web Systems &amp; Technology Team Project</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact &amp; Student Feedback</h2>

            <form action="#" method="POST">
                <fieldset>
                    <legend>Contact Form</legend>

                    <p>
                        <label for="fullname">Full Name:</label><br>
                        <input type="text" id="fullname" name="fullname" required>
                    </p>

                    <p>
                        <label for="email">Email Address:</label><br>
                        <input type="email" id="email" name="email" required>
                    </p>

                    <p>
                        <label for="category">Subject Category:</label><br>
                        <select id="category" name="category">
                            <option value="general">General Inquiry</option>
                            <option value="project">Project Feedback</option>
                            <option value="academic">Academic Collaboration</option>
                        </select>
                    </p>

                    <p>
                        <label for="message">Message:</label><br>
                        <textarea id="message" name="message" rows="5" cols="40" required></textarea>
                    </p>

                    <p>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 BSIT Team. All rights reserved.</p>
    </footer>

</body>
</html>
